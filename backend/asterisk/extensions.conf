; ==============================================================================
; IntelligentCalls Asterisk PBX Call Bridge & Auto-Recorder Dialplan
; ==============================================================================
;
; How this works:
; 1. Mobile app dials the Gateway number (+33180000000) over SIM.
; 2. Asterisk receives the call, extracts target contact number from session database or DTMF.
; 3. MixMonitor records both audio legs (Local SIM + Remote Target) in 16-bit 16kHz WAV.
; 4. Upon call hangup, Asterisk HTTP POSTs the recorded WAV to FastAPI endpoint:
;    POST /api/v1/calls/{CALL_ID}/audio

[globals]
BACKEND_URL=http://192.168.1.7:8000/api/v1

[from-sim-gateway]
exten => _X.,1,NoOp(--- Incoming IntelligentCalls SIM Bridge Request ---)
 same => n,Set(CALL_ID=${SIP_HEADER(X-Call-ID)})
 same => n,ExecIf($["${CALL_ID}" = ""]?Set(CALL_ID=bridge-${UNIQUEID}))
 same => n,Set(RECORDING_FILE=/var/spool/asterisk/monitor/${CALL_ID}.wav)

 ; Start 2-Way High Quality Audio Monitor
 same => n,MixMonitor(${RECORDING_FILE},b)

 ; Dial destination target via PSTN Trunk
 same => n,Dial(PSTN-OUTBOUND/${EXTEN},60,T)
 same => n,Hangup()

; Post-call automated upload handler
exten => h,1,NoOp(--- Call Ended: Uploading 2-Way Recording to IntelligentCalls AI Backend ---)
 same => n,System(curl -X POST -F "file=@${RECORDING_FILE}" ${BACKEND_URL}/calls/${CALL_ID}/audio)
 same => n,System(rm -f ${RECORDING_FILE})
